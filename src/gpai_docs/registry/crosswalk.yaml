# Act-canonical terms with aliases into the connected instruments.
# ISO/IEC 22989 predates the Act: its role terms map partially, and it has no
# general-purpose-AI model or downstream-provider concepts, so those entries
# carry no ISO alias. The Korea entry carries the Art. 2(2) definition
# verbatim from the KLRI translation.
terminology:
  - act_term: AI system # Art. 3(1)
    aliases:
      - target: oecd-ai-principles
        term: AI system
        note: Lineage; the Act's Art. 3(1) definition aligns with the OECD's
          AI-system definition as revised in 2023; the OECD has no
          general-purpose-AI model definition, which is the Act's own concept.
      - target: iso-22989
        term: AI system
        note: Partial match only, an alias rather than equivalence; the ISO
          term predates the Act and carries no placing-on-the-market or
          harmonised regulatory framing.
      - target: kr-ai-basic-act
        term: AI system
        note: "KLRI translation, Art. 2(2): 'AI system' means an AI-based system
          that infers outputs such as predictions, recommendations, and
          decisions that affect real and virtual environments for a given goal
          with various levels of autonomy and adaptability; divergence: the
          Korean definition builds on its own 'artificial intelligence' concept
          (Art. 2(1)) and a given-goal framing, not the Act's machine-based,
          deployment-adaptive framing."
  - act_term: provider # Art. 3(3)
    aliases:
      - target: iso-22989
        term: AI producer
        note: Partial match only; the ISO stakeholder roles predate the Act and
          split design, development and supply differently; ISO has no
          general-purpose-AI model or downstream-provider concepts.
      - target: iso-22989
        term: AI provider
        note: Partial match only; the ISO supplying role does not carry the
          Act's placing-on-the-market trigger, and the Act's provider also
          covers having a model developed under its own name.
      - target: kr-ai-basic-act
        term: AI development business operator
        note: False friend; Korea's Art. 2(7)(a) operator develops and provides
          AI as a business; the Act's provider turns on placing on the market
          or putting into service, and carries the documentation duties.
  - act_term: deployer # Art. 3(4)
    aliases:
      - target: iso-22989
        term: AI customer
        note: Partial match only; the ISO role covers use of an AI product or
          service; the Act's deployer is defined by use under its own
          authority, with duties of its own.
      - target: kr-ai-basic-act
        term: AI use business operator
        note: False friend; Korea's Art. 2(7)(b) operator is a business
          providing AI products or services; the Act's deployer is the user
          under whose authority the system is used.
  - act_term: general-purpose AI model # Art. 3(63)
    aliases:
      - target: kr-ai-basic-act
        term: Generative AI
        note: "Divergence: Korea's Art. 2(5) term is about an AI system that
          generates text, sound, images and other outputs by imitating input
          data; the Act's concept is a model with generality across tasks,
          placed on the market; related, not equivalent."
  - act_term: high-risk AI system # Art. 3(14)
    aliases:
      - target: kr-ai-basic-act
        term: High-impact AI
        note: "Divergence: Korea's Art. 2(4) threshold-plus-list concept (eleven
          areas, plus areas set by Presidential Decree) overlaps but does not
          match the Act's high-risk classification by product-safety route or
          Annex III use."
