schema: 1
pack: eu-ai-act
# The connected instruments. Mappings here are navigation,
# never conformance: each says where an instrument keeps the corresponding
# material, and findings never cite a crosswalk entry. The three serialisation
# formats are recorded with `status: deferred` (populated in v0.2) and are
# referenced by no mapping or alias. ISO targets are `provisional`: no
# authorised copy of any ISO standard was available to verify
# identifiers against, so ISO rows cite clause and Annex identifiers only and
# reproduce no ISO text.
targets:
  - id: eu-gpai-code
    name: Code of Practice for General-Purpose AI Models - Transparency chapter
    version: Transparency chapter, text of 10 July 2025
    date: 2025-07-10
    url: https://digital-strategy.ec.europa.eu/en/policies/contents-code-gpai
    licence: Commission document, CC BY 4.0; reuse with attribution
    identifier_style: Measure 1.1 / 1.2 / 1.3 (Transparency chapter measure numbers)
    status: active
    provisional: false
  - id: nist-ai-rmf
    name: NIST AI Risk Management Framework (AI RMF 1.0)
    version: "1.0"
    date: 2023-01-26
    url: https://doi.org/10.6028/NIST.AI.100-1
    licence: NIST publication, not subject to copyright in the United States;
      reuse with attribution; the NIST disclaimer applies (identification of
      commercial entities implies no endorsement)
    identifier_style: GOVERN 1.1 / MAP 2.2 / MEASURE 2.9 as printed in NIST AI
      100-1; the Playbook abbreviates the functions
    status: active
    provisional: false
  - id: nist-ai-600-1
    name: "NIST AI 600-1 - AI RMF Generative AI Profile"
    version: NIST AI 600-1 (July 2024)
    date: 2024-07-26
    url: https://doi.org/10.6028/NIST.AI.600-1
    licence: NIST publication, not subject to copyright in the United States;
      reuse with attribution; the NIST disclaimer applies (identification of
      commercial entities implies no endorsement)
    identifier_style: Action IDs; function abbreviation, subcategory and
      action number, e.g. MP-2.1-001, GV-4.2-003
    status: active
    provisional: false
  # ISO publishes month precision on its public catalogue pages; the first of
  # the publication month is recorded here.
  - id: iso-42001
    name: "ISO/IEC 42001:2023 — Information technology — Artificial
      intelligence — Management system"
    version: Edition 1 (2023)
    date: 2023-12-01
    url: https://www.iso.org/standard/81230.html
    licence: ISO copyright; identifiers and links only; no text reproduced
    identifier_style: Clause and Annex A identifiers only, e.g. Clause 7.5,
      Annex A.8
    status: active
    provisional: true
  - id: iso-23894
    name: "ISO/IEC 23894:2023 — Information technology — Artificial
      intelligence — Guidance on risk management"
    version: Edition 1 (2023)
    date: 2023-02-01
    url: https://www.iso.org/standard/77304.html
    licence: ISO copyright; identifiers and links only; no text reproduced
    identifier_style: Clause identifiers only, e.g. Clause 6
    status: active
    provisional: true
  - id: iso-42005
    name: "ISO/IEC 42005:2025 — Information technology — Artificial
      intelligence (AI) — AI system impact assessment"
    version: Edition 1 (2025)
    date: 2025-05-01
    url: https://www.iso.org/standard/44545.html
    licence: ISO copyright; identifiers and links only; no text reproduced
    identifier_style: Clause identifiers only, e.g. Clause 6
    status: active
    provisional: true
  - id: iso-22989
    name: "ISO/IEC 22989:2022 — Information technology — Artificial
      intelligence — Artificial intelligence concepts and terminology"
    version: Edition 1 (2022)
    date: 2022-07-01
    url: https://www.iso.org/standard/74296.html
    licence: ISO copyright; terms and identifiers only; no definitions
      reproduced
    identifier_style: Term names and clause numbers only, e.g. 5.19
    status: active
    provisional: true
  - id: oecd-ai-principles
    name: OECD Recommendation of the Council on Artificial Intelligence
    version: OECD/LEGAL/0449, as amended on 3 May 2024
    date: 2019-05-22
    url: https://legalinstruments.oecd.org/en/instruments/OECD-LEGAL-0449
    licence: OECD; reproduced and distributed free of charge, unaltered and
