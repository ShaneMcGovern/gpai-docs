    provisional: false
# One entry per field, in registry order. The EU axis is operational: every
# element's documentation is drawn up under Measure 1.1, provided under
# Measure 1.2 (to downstream providers where the Form marks it for them, to
# the AI Office on request otherwise), and controlled and retained under
# Measure 1.3. NIST rows appear where the verified identifiers genuinely
# carry the element's material; ISO rows cite the two 42001 anchors and the
# 42005 impact-assessment record, all provisional.
mappings:
  - field: XI.1.1.a
    targets:
      - target: eu-gpai-code
        ref: Measure 1.1
        note: Measure 1.1's Model Documentation is where the Code keeps the
          tasks the model is intended to perform.
      - target: eu-gpai-code
        ref: Measure 1.2
        note: The Form marks this item for downstream providers; Measure 1.2
          provides the current Model Documentation to them.
      - target: eu-gpai-code
        ref: Measure 1.3
        note: Measure 1.3 controls this item's documentation for quality and
          integrity and retains it as evidence.
      - target: nist-ai-rmf
        ref: MAP 1.1
        note: The Framework documents intended purposes, uses and deployment
          settings here.
      - target: nist-ai-rmf
        ref: MAP 2.1
        note: The Framework defines the model's specific tasks and methods here.
      - target: nist-ai-600-1
        ref: MP-1.1-002
        note: The Profile keeps the expected and acceptable context of use in
          this action.
      - target: iso-42001
        ref: Clause 7.5
        note: ISO/IEC 42001 keeps the tasks the model is intended to perform as
          documented information under this clause.
      - target: iso-42001
        ref: Annex A.8
        note: The Form marks this item for downstream providers; ISO/IEC 42001
          keeps information for interested parties under Annex A.8.
  - field: XI.1.1.b
    targets:
      - target: eu-gpai-code
        ref: Measure 1.1
        note: Measure 1.1's Model Documentation is where the Code keeps the
          acceptable use policies.
      - target: eu-gpai-code
        ref: Measure 1.2
        note: The Form marks this item for downstream providers; Measure 1.2
          provides the current Model Documentation to them.
      - target: eu-gpai-code
        ref: Measure 1.3
        note: Measure 1.3 controls this item's documentation for quality and
          integrity and retains it as evidence.
      - target: nist-ai-rmf
        ref: MAP 1.1
        note: Acceptable-use expectations are part of the context of use this
          subcategory documents.
      - target: nist-ai-600-1
        ref: GV-1.4-002
        note: The Profile keeps transparent acceptable use policies in this
          action.
      - target: iso-42001
        ref: Clause 7.5
        note: ISO/IEC 42001 keeps the acceptable use policies as documented
          information under this clause.
      - target: iso-42001
        ref: Annex A.8
        note: The Form marks this item for downstream providers; ISO/IEC 42001
          keeps information for interested parties under Annex A.8.
  - field: XI.1.1.c
    targets:
      - target: eu-gpai-code
        ref: Measure 1.1
        note: Measure 1.1's Model Documentation is where the Code keeps the
          release date and the methods of distribution.
      - target: eu-gpai-code
        ref: Measure 1.2
        note: The Form marks this item for downstream providers; Measure 1.2
          provides the current Model Documentation to them.
      - target: eu-gpai-code
        ref: Measure 1.3
        note: Measure 1.3 controls this item's documentation for quality and
          integrity and retains it as evidence.
      - target: iso-42001
        ref: Clause 7.5
        note: ISO/IEC 42001 keeps the release date and distribution methods as
