schema: 1
pack: eu-ai-act
jurisdiction: EU
instrument: Regulation (EU) 2024/1689
covers: [technical-documentation, transparency-information]
# One entry per published element of Annex XI, Section 1 and Section 2, and
# Annex XII. Each binds the element's stored source text to
# the Model Documentation Form rows that carry its information, the recipients
# the information is owed to, the native document key, and its completeness
# rules. A field lists every form row drawing on the element, in published
# order; the Form's rows are finer than the elements, so several rows can
# serve one element and twin elements share rows. `audience_flags` is the
# union of the listed rows' crosses. `context` names the chapeau that
# conditions every element; XI.1.2.e also names the conditioning note that
# follows point 2(e). `condition: systemic_risk` marks a field that applies
# only to models with systemic risk (Annex XI, Section 2): completeness
# checks it only when the document says `systemic_risk: true`, and its Form
# mapping is row-less with the recorded note, because the Model Documentation
# Form does not carry the section's information.
fields:
  - id: XI.1.1.a
    annex: XI
    section: 1
    point: "1(a)"
    label: Tasks the model is intended to perform
    recipients: [ai_office, nca]
    form:
      rows:
        - use/intended-uses
        - use/type-and-nature-of-ai-systems
      audience_flags: [ai_office, nca, downstream]
    source: reg-2024-1689-annex-xi-1-1-a
    context: [reg-2024-1689-annex-xi-chapeau]
    guidance: Describe the tasks the model is intended to perform and the type
      and nature of AI systems in which it can be integrated.
    model_field: annex_xi.intended_tasks
    rules: [completeness, type:text]
  - id: XI.1.1.b
