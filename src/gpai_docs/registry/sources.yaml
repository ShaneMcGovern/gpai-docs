    retrieved: 2026-10-08
    verification: artifact
    text:
      Based on the considerations above, an indicative criterion for when a downstream
      modifier is considered to be the provider of a general-purpose AI model is that
      the training compute used for the modification is greater than a third of the
      training compute of the original model (see paragraph 115 for how ‘training compute’
      should be understood in these guidelines).
    sha256: 418dbb6f0d0fcab414b9cecd83dc29eb9f821a5b4d41cd4e3762820ef322be15
  - id: guidelines-c2025-7719-120-compute-estimation
    kind: guidelines
    instrument:
      Commission Guidelines on the scope of the obligations for providers
      of general-purpose AI models established by Regulation (EU) 2024/1689 (AI Act)
    location: GPAI Guidelines C(2025) 7719, Annex A.2, paragraph 120
    language: en
    url: https://digital-strategy.ec.europa.eu/en/library/guidelines-scope-obligations-providers-general-purpose-ai-models-under-ai-act
    artifact_url: https://ec.europa.eu/newsroom/dae/redirection/document/118340
    artifact_sha256: 13481bd90108505c477165c8aefb13dbe7a83847bad0e983e09115f78aeefe78
    retrieved: 2026-10-08
    verification: artifact
    text:
      Providers may choose any method to estimate the relevant amount of training
      compute, so long as the estimated amount is, in the providers’ best judgement,
      accurate within an overall error margin of 30% of the reported estimate. This
      is to account for the difficulties providers may face in obtaining precise estimates
      of their model’s cumulative training compute, for example, when estimates are
      made before training of the model is completed. Providers are nevertheless expected
      to document the assumptions made in making their estimations, including the method
      of estimation, and the associated uncertainties.
    sha256: 7aae5cb6c1fe03b6ac3814ca599a81afcef7e56e3a09d3c783f38b43460e5082
