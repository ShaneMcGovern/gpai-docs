      pursuant to paragraph 1, point (a), when the cumulative amount of computation
      used for its training measured in floating point operations is greater than 10^25.
    sha256: 3bd61f7843bd3ce4861663b5b575eb26a0023ae04a4dbb457d876e11de9aa9f9
  - id: reg-2024-1689-art-52-1
    kind: regulation
    instrument: Regulation (EU) 2024/1689
    celex: 02024R1689-20260727
    location: Article 52(1)
    language: en
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    fetch_url: https://publications.europa.eu/resource/cellar/b1730fb2-8f1c-11f1-9262-01aa75ed71a1.0001.03/DOC_1
    extraction:
      kind: article
      article: 52
      paragraph: 1
    retrieved: 2026-10-08
    verification: extract
    text:
      Where a general-purpose AI model meets the condition referred to in Article
      51(1), point (a), the relevant provider shall notify the Commission without delay
      and in any event within two weeks after that requirement is met or it becomes
      known that it will be met. That notification shall include the information necessary
      to demonstrate that the relevant requirement has been met. If the Commission becomes
      aware of a general-purpose AI model presenting systemic risks of which it has
      not been notified, it may decide to designate it as a model with systemic risk.
    sha256: cf3c848d23747dd5d6e5305464f6b0ad9f2ee9174b7f5fd4b3738f70781c88fa
