  - id: guidelines-c2025-7719-60-one-third-criterion
    kind: guidelines
    instrument:
      Commission Guidelines on the scope of the obligations for providers
      of general-purpose AI models established by Regulation (EU) 2024/1689 (AI Act)
    location: GPAI Guidelines C(2025) 7719, paragraph 60
    language: en
    url: https://digital-strategy.ec.europa.eu/en/library/guidelines-scope-obligations-providers-general-purpose-ai-models-under-ai-act
