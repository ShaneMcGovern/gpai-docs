  - id: reg-2024-1689-art-53-4
    kind: regulation
    instrument: Regulation (EU) 2024/1689
    celex: 02024R1689-20260727
    location: Article 53(4)
    language: en
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    fetch_url: https://publications.europa.eu/resource/cellar/b1730fb2-8f1c-11f1-9262-01aa75ed71a1.0001.03/DOC_1
    extraction:
      kind: article
      article: 53
      paragraph: 4
    retrieved: 2026-10-08
    verification: extract
    text:
      Providers of general-purpose AI models may rely on codes of practice within
      the meaning of Article 56 to demonstrate compliance with the obligations set out
      in paragraph 1 of this Article, until a harmonised standard is published. Compliance
      with European harmonised standards grants providers the presumption of conformity
      to the extent that those standards cover those obligations. Providers of general-purpose
      AI models who do not adhere to an approved code of practice or do not comply with
      a European harmonised standard shall demonstrate alternative adequate means of
      compliance for assessment by the Commission.
    sha256: f6ad71e4bea7c3079c3f47cfc018f0bec9e4de6a65ca9ae66f17d3f0af583f43
  - id: code-gpai-transparency-1-1-documentation
