---
default_install_hook_types: [pre-commit, commit-msg]

# Without this, a hook with no explicit `stages` runs at EVERY stage, so the
# hygiene hooks would fire again against COMMIT_EDITMSG on each commit and can
# rewrite the message.
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^\.devcontainer/devcontainer\.json$
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  # pre-commit/mirrors-prettier is archived upstream; this fork is maintained.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml, json]
        # devcontainer.json is excluded because it is JSONC, which prettier
        # would rewrite into something check-json then rejects.
        exclude: ^\.devcontainer/devcontainer\.json$

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint-fix
        exclude: ^CHANGELOG\.md$

  # Fails when uv.lock has drifted from pyproject.toml. CI installs with
  # `uv sync --frozen`, which never checks, so nothing else catches it.
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.21
    hooks:
      - id: uv-lock

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
